name: Tasks

on:
  push:
  pull_request:

jobs:
  lint-php:
    name: "linting:    php: ${{ matrix.php }} Symfony: ${{ matrix.symfony }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        symfony: [ '6.4', '7.3', '8.0' ]
        exclude:
          - php: '8.2'
            symfony: '8.0'
          - php: '8.3'
            symfony: '8.0'
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php }}-composer-
      - run: composer require symfony/http-kernel="^${{ matrix.symfony }}" --dev
      - run: composer check-platform-reqs
      - run: composer audit --abandoned=report
      - name: Run the complete static checks
        shell: bash
        run: |
          set -o pipefail
          ./vendor/bin/grumphp run --no-ansi 2>&1 | tee /tmp/php85-grumphp.log
      - name: Report failed checks
        if: failure()
        run: |
          if [ -f /tmp/php85-grumphp.log ]; then
            php -r '$s=file_get_contents("/tmp/php85-grumphp.log"); echo "::error::".str_replace(["%", "\r", "\n"], ["%25", "%0D", "%0A"], substr($s, -25000))."\n";'
          fi
